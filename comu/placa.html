      <p class="placa-text">L’<span class="placa-gotic">Orloj</span> de Praga fou construït pel mestre Hanuš (Jan Růže) i pel seu ajudant Jakub Čech el 1490. Els regidors cegaren al mestre perquè no pogués construir cap altre rellotge com aquell. Čech venjà el seu mestre introduint la mà en el mecanisme, que quedà inutilitzat, a costa de quedar manc.</p>
