<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orloj">
<meta name="theme-color" content="#100c08">
<title>Orloj — iPhone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --nit: #0a1330;
    --nit2: #142452;
    --pedra: #211a13;
    --pedra2: #16110c;
    --or: #d4af37;
    --or-clar: #f2d98a;
    --or-fosc: #8a6d1f;
    --or-viu: #f0c65c;
    --ivori: #f2e8d0;
    --vermell: #7a1f1f;
    --arg: #c9d2e0;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #3a2c18 0%, transparent 55%),
      radial-gradient(ellipse at 50% 120%, #000 0%, transparent 60%),
      linear-gradient(180deg, var(--pedra) 0%, var(--pedra2) 100%);
    color: var(--ivori);
    font-family: 'Cormorant Garamond', serif;
  }

  body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height: 100dvh;
    overflow-y: auto;
    padding:
      max(10px, env(safe-area-inset-top))
      max(10px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom))
      max(10px, env(safe-area-inset-left));
  }

  .marc{
    width: min(100%, 92vh);
    max-width: 460px;
    border-radius: 22px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(212,175,55,0.06), transparent 60%),
      linear-gradient(180deg, #1b140d 0%, #100c08 100%);
    padding: 1.4vh 4vw 1.2vh;
    position: relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .contingut{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  .columna-esq, .columna-dre{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }

  header{
    text-align:center;
    flex: 0 0 auto;
  }
  h1{
    font-family: 'UnifrakturMaguntia', cursive;
    font-weight: 400;
    font-size: clamp(22px, 7vh, 38px);
    margin: 2px 0 0;
    color: var(--or-clar);
    text-shadow: 0 0 18px rgba(212,175,55,0.35), -1px -1px 0px rgba(255,250,230,0.45), 1px 1px 1.5px rgba(0,0,0,0.7);
    letter-spacing: 1px;
    line-height:1;
    cursor: pointer;
  }
  h1:active{
    filter: brightness(0.85);
  }
  .subtitol{
    font-family: 'Cinzel', serif;
    font-size: clamp(8px, 1.6vh, 11px);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--or-viu);
    font-weight: 600;
    text-shadow: 0 0 6px rgba(240,198,92,0.35), -0.8px -0.8px 0 rgba(255,250,230,0.4), 0.8px 0.8px 1px rgba(0,0,0,0.65);
  }

  .disc-wrap{
    width: min(62vw, 40vh, 420px);
    flex: 0 0 auto;
    margin: 1vh auto 0;
    position: relative;
    aspect-ratio: 1 / 1;
  }
  .disc-wrap svg{ width:100%; height:100%; display:block; overflow:visible; }
  #astrolabiExt{ position:absolute; inset:0; }

  /* Gir de l'esfera interior (zodíac, lluna, busques): a les 12 del migdia i del
     vespre, en sentit contrari al de l'esfera del calendari, amb el mateix
     efecte de volum cilíndric daurat. La mida (87,3%) i el requadre retallat
     (viewBox) del SVG interior arriben fins radi 262, prou per cobrir la busca
     dels segons, que és la que arriba més lluny (radi 258) cap a l'anella blanca. */
  .astrolabi-flip-wrap{
    position: absolute;
    top: 50%; left: 50%;
    width: 88.67%;
    height: 88.67%;
    transform: translate(-50%, -50%);
    perspective: 1600px;
  }
  .astrolabi-flip{
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }
  .astrolabi-flip.girant{
    animation: orlojGirAstrolabi 9s cubic-bezier(.45,.05,.55,.95);
  }
  @keyframes orlojGirAstrolabi{
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(-360deg); }
  }
  .cos-cilindre-ast{
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    pointer-events: none;
    /* Invisible en repòs: com que la cara frontal té zones transparents
       (fora del disc del zodíac), aquesta pila daurada només s'ha de veure
       mentre dura el gir; en repòs quedaria tapant l'anella de les hores. */
    opacity: 0;
  }
  .astrolabi-flip.girant .cos-cilindre-ast{
    opacity: 1;
  }
  .cos-cilindre-ast .capa-volum-ast{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 36%,
      #fff6db 0%,
      #f0c65c 22%,
      #d4af37 45%,
      #b8860b 70%,
      #6b4c05 100%);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.7);
  }
  .cara-davant-ast, .cara-darrere-ast{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }
  .cara-davant-ast{
    transform: translateZ(14px);
    background: transparent;
  }
  .cara-davant-ast svg{ width:100%; height:100%; display:block; overflow:visible; }
  .cara-darrere-ast{
    transform: rotateY(180deg) translateZ(14px);
    background:
      radial-gradient(circle at 32% 28%, #fff6db 0%, #f0c65c 32%, #c9a227 62%, #6e5416 100%);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lema-gravat-ast{
    font-family:'UnifrakturMaguntia', cursive;
    font-weight:400;
    font-size: clamp(24px, 5vw, 44px);
    letter-spacing: 0.5px;
    text-align:center;
    color: #9c7a1f;
    text-shadow:
      -1px -1px 1px rgba(60,40,5,0.65),
      1px 1.5px 1.5px rgba(255,244,200,0.7);
    padding: 0 6%;
  }

  .calendari-wrap{
    width: min(33vw, 21vh, 190px);
    margin: 1vh auto 0;
    position: relative;
    z-index: 2;
    flex: 0 0 auto;
    perspective: 1400px;
  }
  .calendari-wrap svg{ width:100%; height:auto; display:block; }

  .calendari-flip{
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    transform-style: preserve-3d;
  }
  .calendari-flip.girant{
    animation: orlojGirCalendari 9s cubic-bezier(.45,.05,.55,.95);
  }
  @keyframes orlojGirCalendari{
    from { transform: rotateY(0deg); }
    to   { transform: rotateY(360deg); }
  }

  .cos-cilindre{
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    pointer-events: none;
  }
  .cos-cilindre .capa-volum{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 36%,
      #fff6db 0%,
      #f0c65c 22%,
      #d4af37 45%,
      #b8860b 70%,
      #6b4c05 100%);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.7);
  }

  .cara-davant, .cara-darrere{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }
  .cara-davant{
    transform: translateZ(14px);
  }
  .cara-davant svg{ width:100%; height:100%; }
  .cara-darrere{
    transform: rotateY(180deg) translateZ(14px);
    background:
      radial-gradient(circle at 32% 28%, #fff6db 0%, #f0c65c 32%, #c9a227 62%, #6e5416 100%);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lema-gravat{
    font-family:'UnifrakturMaguntia', cursive;
    font-weight:400;
    font-size: clamp(13px, 8.5vw, 23px);
    letter-spacing: 0.4px;
    text-align:center;
    color: #9c7a1f;
    text-shadow:
      -0.8px -0.8px 1px rgba(60,40,5,0.65),
      0.8px 1.2px 1.2px rgba(255,244,200,0.7);
  }

  .lectura{
    text-align:center;
    flex: 0 0 auto;
    font-family:'Cinzel', serif;
  }
  .hora-digital{
    font-size: clamp(18px, 4.6vh, 28px);
    letter-spacing: 0;
    color: var(--or-clar);
    text-shadow: 0 0 12px rgba(212,175,55,0.3), -1px -1px 0 rgba(255,250,230,0.4), 1px 1px 1.5px rgba(0,0,0,0.7);
  }
  .hora-digital .xifra{
    display: inline-block;
    width: 0.62em;
    text-align: center;
  }
  .hora-digital .separador-hora{
    display: inline-block;
    width: 0.32em;
    text-align: center;
  }
  .data-digital{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(11px, 2.4vh, 15px);
    color: var(--arg);
    margin-top: 1px;
    text-shadow: -0.8px -0.8px 0 rgba(255,250,230,0.3), 0.8px 0.8px 1px rgba(0,0,0,0.5);
  }
  .luna-linia{
    margin-top: 3px;
    font-size: clamp(9px, 1.8vh, 12px);
    letter-spacing: 1.2px;
    color: var(--or-viu);
    font-weight: 600;
    text-transform: uppercase;
    text-shadow: -0.8px -0.8px 0 rgba(255,250,230,0.35), 0.8px 0.8px 1px rgba(0,0,0,0.6);
  }

  .ambient-linia{
    margin-top: 5px;
    font-size: clamp(10px, 2.4vw, 12px);
    letter-spacing: 1.2px;
    color: var(--or-viu);
    text-transform: uppercase;
    opacity: 0.9;
    text-shadow: -0.7px -0.7px 0 rgba(255,250,230,0.3), 0.7px 0.7px 1px rgba(0,0,0,0.55);
  }
  .ambient-linia .separador-punt{
    color: var(--or-fosc);
    margin: 0 5px;
  }

  .separador{
    width: 55%;
    max-width: 200px;
    height: 1px;
    margin: 6px auto;
    background: linear-gradient(90deg, transparent, var(--or-fosc), transparent);
  }

  .lema{
    display:none;
  }

  text{ font-family:'Cinzel', serif; user-select:none; }
  .num-antic{ font-family:'UnifrakturMaguntia', cursive; }

  @media (prefers-reduced-motion: reduce){
    * { transition: none !important; }
  }

  /* Mòbil en horitzontal: disposició en dues columnes, com la versió de tauleta */
  @media (orientation: landscape) and (max-height: 600px){
    body{ align-items:center; }
    .marc{
      width: min(96vw, 780px);
      max-width: none;
      padding: 1.6vh 3vw;
    }
    .contingut{
      flex-direction: row;
      align-items: center;
      gap: 3vw;
    }
    .columna-esq{ flex: 1 1 56%; width:auto; }
    .columna-dre{ flex: 1 1 40%; width:auto; }

    header{ margin-bottom: 0; }
    h1{ font-size: clamp(16px, 5.5vh, 26px); margin: 0; }
    .subtitol{ font-size: clamp(7px, 1.4vh, 10px); }

    .disc-wrap{
      width: min(44vw, 68vh, 380px);
      margin: 0.4vh auto 0;
    }
    .calendari-wrap{
      width: min(24vw, 38vh, 175px);
      margin: 0.5vh auto 0;
    }
    .separador{ margin: 3px auto; }
    .hora-digital{ font-size: clamp(14px, 5vh, 26px); }
    .data-digital{ font-size: clamp(9px, 2.2vh, 14px); }
    .luna-linia{ font-size: clamp(7px, 1.7vh, 11px); }
    .ambient-linia{ font-size: clamp(7px, 1.7vh, 11px); }
  }
</style>
</head>
<body>

  <div class="marc">
    <div class="contingut">
      <div class="columna-esq">
        <header>
          <div class="subtitol">Praga · MCDX</div>
          <h1>Orloj</h1>
        </header>

        <div class="disc-wrap">
          <svg id="astrolabiExt" viewBox="0 0 600 600"></svg>
          <div class="astrolabi-flip-wrap">
            <div class="astrolabi-flip" id="astrolabiFlip">
              <div class="cos-cilindre-ast" id="cosCilindreAst"></div>
              <div class="cara-davant-ast">
                <svg id="astrolabi" viewBox="34 34 532 532"></svg>
              </div>
              <div class="cara-darrere-ast"><span class="lema-gravat-ast">Astra manent,<br>sed…</span></div>
            </div>
          </div>
        </div>
      </div>

      <div class="columna-dre">
        <div class="calendari-wrap">
          <div class="calendari-flip" id="calendariFlip">
            <div class="cos-cilindre" id="cosCilindre"></div>
            <div class="cara-davant">
              <svg id="calendari" viewBox="0 0 300 300"></svg>
            </div>
            <div class="cara-darrere"><span class="lema-gravat">tempus<br>fugit</span></div>
          </div>
        </div>

        <div class="separador"></div>

        <div class="lectura">
          <div class="hora-digital" id="lecturaHora">--:--:--</div>
          <div class="data-digital" id="lecturaData">—</div>
          <div class="luna-linia" id="lecturaLluna">—</div>
          <div class="ambient-linia"><span id="lecturaTemp">--°C</span><span class="separador-punt">·</span><span id="lecturaHum">--%</span><span class="separador-punt">·</span><span id="lecturaSensacio">--°C</span><span class="separador-punt">·</span><span id="lecturaAlt">-- m</span></div>
      <div class="ambient-linia" id="lecturaLloc">—</div>
        </div>
      </div>
    </div>
  </div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg";
  const CX = 300, CY = 300;

  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function polarX(cx, r, angDeg){ return cx + r * Math.sin(angDeg * Math.PI/180); }
  function polarY(cy, r, angDeg){ return cy - r * Math.cos(angDeg * Math.PI/180); }

  // Forma d'estel de quatre puntes (centelleig), centrada a l'origen
  function pathEstel(r){
    const rInner = r * 0.28;
    let punts = [];
    for (let i=0;i<8;i++){
      const ang = i*45 - 90;
      const radi = (i%2===0) ? r : rInner;
      const x = radi*Math.cos(ang*Math.PI/180);
      const y = radi*Math.sin(ang*Math.PI/180);
      punts.push(`${x.toFixed(2)},${y.toFixed(2)}`);
    }
    return 'M' + punts.join('L') + 'Z';
  }

  // ==================== El cos del cilindre amb volum ====================
  (function generaVolumCilindre(){
    const contenidor = document.getElementById('cosCilindre');
    if (!contenidor) return;

    const totalCapes = 24;
    const gruixTotal = 28;

    for (let i = 0; i < totalCapes; i++) {
      const capa = document.createElement('div');
      capa.className = 'capa-volum';

      const zPos = -gruixTotal/2 + (i * (gruixTotal / (totalCapes - 1)));

      capa.style.position = 'absolute';
      capa.style.inset = '0';
      capa.style.borderRadius = '50%';
      capa.style.transform = `translateZ(${zPos.toFixed(2)}px)`;

      contenidor.appendChild(capa);
    }
  })();

  // ==================== El cos del cilindre de l'esfera interior (astrolabi) ====================
  (function generaVolumCilindreAstrolabi(){
    const contenidor = document.getElementById('cosCilindreAst');
    if (!contenidor) return;

    const totalCapes = 24;
    // Una mica menys que la profunditat de les cares (14px), per evitar que
    // la capa més externa de la pila coincideixi exactament amb la cara
    // frontal (conflicte de renderització "z-fighting" que feia que el
    // daurat es filtrés per les zones transparents fins i tot en repòs).
    const gruixTotal = 25.2;

    for (let i = 0; i < totalCapes; i++) {
      const capa = document.createElement('div');
      capa.className = 'capa-volum-ast';

      const zPos = -gruixTotal/2 + (i * (gruixTotal / (totalCapes - 1)));

      capa.style.position = 'absolute';
      capa.style.inset = '0';
      capa.style.borderRadius = '50%';
      capa.style.transform = `translateZ(${zPos.toFixed(2)}px)`;

      contenidor.appendChild(capa);
    }
  })();

  // Fletxa/punxa de relleu (inspirada en una punta de tanca de ferro forjat), amb la punta a l'origen (0,0)
  const fletxaFerroPath = "M 0,0 L -4.5,-13 C -4.5,-16 -3,-17 -2,-18 C -6,-17 -11,-18 -13,-22 C -14,-24 -13,-25.5 -11,-25 C -8,-24.3 -5,-23 -3,-24.5 C -2.5,-27 -1,-29 0,-31 C 1,-29 2.5,-27 3,-24.5 C 5,-23 8,-24.3 11,-25 C 13,-25.5 14,-24 13,-22 C 11,-18 6,-17 2,-18 C 3,-17 4.5,-16 4.5,-13 L 0,0 Z";

  const svg = document.getElementById('astrolabi');
  svg.setAttribute('overflow','visible');
  const svgExt = document.getElementById('astrolabiExt');
  svgExt.setAttribute('overflow','visible');

  // ---------- DEFS ----------
  const defs = el('defs', {});
  const skyGrad = el('radialGradient', {id:'ceil', cx:'50%', cy:'42%', r:'75%'});
  skyGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#1c2f66'}));
  skyGrad.appendChild(el('stop', {offset:'55%', 'stop-color':'#101c45'}));
  skyGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#060b1f'}));
  defs.appendChild(skyGrad);

  const goldGrad = el('linearGradient', {id:'orBanda', x1:'0%', y1:'0%', x2:'0%', y2:'100%'});
  goldGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#f3de9a'}));
  goldGrad.appendChild(el('stop', {offset:'50%', 'stop-color':'#c9a227'}));
  goldGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#8a6d1f'}));
  defs.appendChild(goldGrad);

  const ivoriGrad = el('linearGradient', {id:'ivoriBanda', x1:'0%', y1:'0%', x2:'0%', y2:'100%'});
  ivoriGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#fbf6e6'}));
  ivoriGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#e4d6ac'}));
  defs.appendChild(ivoriGrad);

  const hubGrad = el('radialGradient', {id:'nucli', cx:'35%', cy:'30%', r:'70%'});
  hubGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#f6e6a6'}));
  hubGrad.appendChild(el('stop', {offset:'60%', 'stop-color':'#c9a227'}));
  hubGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#6e5416'}));
  defs.appendChild(hubGrad);

  const lunaGranGrad = el('radialGradient', {id:'lunaGranBanda', cx:'38%', cy:'32%', r:'75%'});
  lunaGranGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#faf3d9'}));
  lunaGranGrad.appendChild(el('stop', {offset:'60%', 'stop-color':'#e6d19f'}));
  lunaGranGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#b99a5c'}));
  defs.appendChild(lunaGranGrad);

  const perlaGrad = el('radialGradient', {id:'perlaBanda', cx:'32%', cy:'28%', r:'75%'});
  perlaGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#eafcfa'}));
  perlaGrad.appendChild(el('stop', {offset:'30%', 'stop-color':'#4dd0c4'}));
  perlaGrad.appendChild(el('stop', {offset:'70%', 'stop-color':'#159084'}));
  perlaGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#063f38'}));
  defs.appendChild(perlaGrad);

  const ferroGrad = el('radialGradient', {id:'ferroBanda', cx:'32%', cy:'26%', r:'80%'});
  ferroGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#ffb3c0'}));
  ferroGrad.appendChild(el('stop', {offset:'30%', 'stop-color':'#c8102e'}));
  ferroGrad.appendChild(el('stop', {offset:'65%', 'stop-color':'#7a0a1f'}));
  ferroGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#2b0510'}));
  defs.appendChild(ferroGrad);

  const solGrad = el('radialGradient', {id:'solBanda', cx:'35%', cy:'32%', r:'70%'});
  solGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#fffadd'}));
  solGrad.appendChild(el('stop', {offset:'45%', 'stop-color':'#f6d76a'}));
  solGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#c9861a'}));
  defs.appendChild(solGrad);

  const lunaLitGrad = el('radialGradient', {id:'lunaLitBanda', cx:'32%', cy:'30%', r:'75%'});
  lunaLitGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#fffdf6'}));
  lunaLitGrad.appendChild(el('stop', {offset:'55%', 'stop-color':'#e8e2c8'}));
  lunaLitGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#b8ae8e'}));
  defs.appendChild(lunaLitGrad);

  const lunaDarkGrad = el('radialGradient', {id:'lunaDarkBanda', cx:'62%', cy:'68%', r:'75%'});
  lunaDarkGrad.appendChild(el('stop', {offset:'0%', 'stop-color':'#3a4258'}));
  lunaDarkGrad.appendChild(el('stop', {offset:'100%', 'stop-color':'#1a1e2c'}));
  defs.appendChild(lunaDarkGrad);

  function formataHoraAmplaFixa(text){
    return text.split('').map(ch=>{

      return `<span class="xifra">${ch}</span>`;

  function faseLunar(d){
    // Referència: lluna nova real i propera (2026-08-12 17:38 UTC, eclipsi solar total).
    // Fer servir una referència propera enlloc d'una de fa 25 anys evita que l'error
    // orbital acumulat (l'òrbita lunar no és perfectament periòdica) desviï el resultat.
    // Convé refrescar aquesta data cada pocs anys perquè es mantingui precisa.
    const refNouLluna = Date.UTC(2026,7,12,17,38,0);
    const sinodic = 29.530588853;
    const dies = (d.getTime() - refNouLluna) / 86400000;
    let fase = (dies % sinodic) / sinodic;
    if (fase < 0) fase += 1;
    return fase; // 0=nova, 0.5=plena
  }

  function nomFaseLunar(fase){
    if (fase < 0.02 || fase > 0.98) return 'Lluna nova';
    if (fase < 0.24) return 'Lluna creixent';
    if (fase < 0.26) return 'Quart creixent';
    if (fase < 0.49) return 'Gibosa creixent';
    if (fase < 0.51) return 'Lluna plena';
    if (fase < 0.74) return 'Gibosa minvant';
    if (fase < 0.76) return 'Quart minvant';
    return 'Lluna minvant';
  }

  function pathLluna(r, fase){
    // fase 0..1, 0=nova, 0.5=plena — retorna la part il·luminada.
    // El sentit del traç del terminador ha de dependre de si estem al tram
    // falcat (creixent/minvant, resta àrea) o gibós (afegeix àrea cap a plena),
    // no només de si fase<0.5 — altrament la forma "rebota" cap enrere en
    // lloc de seguir creixent fins a plena.
    const theta = fase * 2 * Math.PI;
    const rx = r * Math.cos(theta);
    const sweepOuter = fase < 0.5 ? 1 : 0;
    const sweepInner = rx < 0 ? sweepOuter : (1 - sweepOuter);
    return `M 0,${-r} A ${r},${r} 0 0,${sweepOuter} 0,${r} A ${Math.abs(rx).toFixed(2)},${r} 0 0,${sweepInner} 0,${-r} Z`;
  }

  let audioCtxOrloj = null;
  function obtenirAudioCtx(){
    if (!audioCtxOrloj){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtxOrloj = new AC();
    }
    if (audioCtxOrloj.state === 'suspended') audioCtxOrloj.resume();
    return audioCtxOrloj;
  }
  ['click','touchstart'].forEach(ev=>{
    document.addEventListener(ev, ()=>{ obtenirAudioCtx(); }, {once:true, passive:true});
  });
  // Quan la pestanya torna a primer pla (per exemple després d'estar la pantalla
  // apagada o en segon pla), intentem reprendre l'àudio si s'hagués suspès.
  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState === 'visible') obtenirAudioCtx();
  });

  // Campana greu (per a les hores) i campana lleu (per als quarts), amb el mateix
  // timbre de base però una octava-quinta més amunt en el cas de la lleu.
  function reprodueixCampanaGreu(){
    const ctx = obtenirAudioCtx();
    if (!ctx) return;
    const ara = ctx.currentTime;
    const parcials = [156, 234, 313, 393, 470];
    const guanys    = [0.55, 0.32, 0.20, 0.12, 0.07];
    parcials.forEach((freq,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ara);
      gain.gain.linearRampToValueAtTime(guanys[i], ara + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0008, ara + 1.8);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ara);
      osc.stop(ara + 1.9);
    });
  }
  function reprodueixCampanaLleu(){
    const ctx = obtenirAudioCtx();
    if (!ctx) return;
    const ara = ctx.currentTime;
    const parcials = [247, 370, 494, 622, 740];
    const guanys    = [0.45, 0.28, 0.16, 0.09, 0.05];
    parcials.forEach((freq,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, ara);
      gain.gain.linearRampToValueAtTime(guanys[i], ara + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0008, ara + 1.5);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ara);
      osc.stop(ara + 1.6);
    });
  }

  // brunziment greu de fons, durant tot el temps que dura el gir del disc.

  let bufferEngranatge = null;
  function carregaBufferEngranatge(ctx){
    if (bufferEngranatge) return Promise.resolve(bufferEngranatge);
    const binari = atob(SO_ENGRANATGE_B64);
    const bytes = new Uint8Array(binari.length);
    for (let i=0;i<binari.length;i++) bytes[i] = binari.charCodeAt(i);
    return ctx.decodeAudioData(bytes.buffer).then(buf => { bufferEngranatge = buf; return buf; });
  }

  function reprodueixCloc(quan){
    const ctx = obtenirAudioCtx();
    if (!ctx) return;
    const midaBufer = Math.max(1, Math.floor(ctx.sampleRate * 0.015));
    const buffer = ctx.createBuffer(1, midaBufer, ctx.sampleRate);
    const dades = buffer.getChannelData(0);
    for (let i=0;i<midaBufer;i++){ dades[i] = (Math.random()*2-1) * Math.pow(1 - i/midaBufer, 1.5); }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filtre = ctx.createBiquadFilter();
    filtre.type = 'lowpass';
    filtre.frequency.value = 1800;
    const gainClic = ctx.createGain();
    gainClic.gain.value = 0.5;
    src.connect(filtre);
    filtre.connect(gainClic);
    gainClic.connect(ctx.destination);
    src.start(quan);
    src.stop(quan + 0.02);

    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, quan);
    osc.frequency.exponentialRampToValueAtTime(60, quan + 0.12);
    const gainThump = ctx.createGain();
    gainThump.gain.setValueAtTime(0.0001, quan);
    gainThump.gain.linearRampToValueAtTime(0.5, quan + 0.008);
    gainThump.gain.exponentialRampToValueAtTime(0.0008, quan + 0.22);
    osc.connect(gainThump);
    gainThump.connect(ctx.destination);
    osc.start(quan);
    osc.stop(quan + 0.25);
  }

  function reprodueixSoEngranatge(durataS){
    const ctx = obtenirAudioCtx();
    if (!ctx) return;
    carregaBufferEngranatge(ctx).then(buffer => {
      const ara = ctx.currentTime;
      // Reproduït encara més lent, el so queda més lent i més greu (efecte
      // natural d'alentir un enregistrament).
      const ratioVelocitat = 0.3;
      const durataBuffer = buffer.duration / ratioVelocitat;
      // Aquest clip té silenci real tant a l'inici com al final, així que hi
      // apliquem un encreuament suau (entrada i sortida) per encadenar les
      // repeticions sense costura audible.
      const creuament = 0.03;
      const pas = durataBuffer - creuament;
      const final = ara + durataS;
      const gainGeneral = ctx.createGain();
      gainGeneral.gain.value = 0.175;
      // Filtre de pas baix per llimar les variacions més brusques i fer que
      // el conjunt soni més rodó i continu, en lloc d'anar "a trompicons".
      const filtrePasBaix = ctx.createBiquadFilter();
      filtrePasBaix.type = 'lowpass';
      filtrePasBaix.frequency.value = 650;
      filtrePasBaix.Q.value = 0.7;
      // Compressor per suavitzar les diferències de volum del clip i fer que
      // el conjunt soni més regular.
      const compressor = ctx.createDynamicsCompressor();
      compressor.threshold.value = -35;
      compressor.knee.value = 10;
      compressor.ratio.value = 10;
      compressor.attack.value = 0.002;
      compressor.release.value = 0.15;
      gainGeneral.connect(filtrePasBaix);
      filtrePasBaix.connect(compressor);
      compressor.connect(ctx.destination);

      let t = ara;
      let primera = true;
      while (t < final){
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.playbackRate.value = ratioVelocitat;
        const gain = ctx.createGain();
        src.connect(gain);
        gain.connect(gainGeneral);

        // Si aquesta còpia, tocada sencera, s'allargaria més enllà del final
        // previst, n'escurcem l'esvaïment perquè acabi exactament al final
        // (evita que el "cloc" soni mentre encara hi ha engranatge sonant).
        const finalNatural = t + durataBuffer;
        const finalEfectiu = Math.min(finalNatural, final);
        const iniciEsvaiment = Math.max(t, finalEfectiu - creuament);

        if (primera){
          gain.gain.setValueAtTime(1, t);
        } else {
          gain.gain.setValueAtTime(0, t);
          gain.gain.linearRampToValueAtTime(1, t + creuament);
        }
        gain.gain.setValueAtTime(1, iniciEsvaiment);
        gain.gain.linearRampToValueAtTime(0, finalEfectiu);

        src.start(t);
        src.stop(finalEfectiu + 0.05);

        t += pas;
        primera = false;
      }

      const marge = 0.05;
      reprodueixCloc(ara + durataS - marge);
    }).catch(err=>{ console.warn('Orloj: no s\'ha pogut carregar el so d\'engranatge', err); });
  }

  const calendariFlipEl = document.getElementById('calendariFlip');
  let girEnCurs = false;
  if (calendariFlipEl){

    });
  }

  function llancaGirCalendari(){
    if (!calendariFlipEl || girEnCurs) return;
    girEnCurs = true;
    calendariFlipEl.classList.remove('girant');
    void calendariFlipEl.offsetWidth;
    calendariFlipEl.classList.add('girant');
    reprodueixSoEngranatge(9);
  }

  const inicPaginaMs = performance.now();
  let primerGirFet = false;
  let darrerCodiGir = -1;
  function comprovaGirCalendari(ara){
    if (!primerGirFet && performance.now() - inicPaginaMs >= 7000){
      primerGirFet = true;
      llancaGirCalendari();
    }
    const s = ara.getSeconds();
    const m = ara.getMinutes();
    const h = ara.getHours();
    // Finestra de tolerància curta (igual que a les campanades) per si el
    // rellotge va endarrerit, però sense allargar-se massa perquè el gir
    // (9s) ha d'acabar abans que comencin els quarts a l'hora en punt.
    if (m === 59 && s >= 50 && s <= 52){
      const codi = h*100 + 59;
      if (darrerCodiGir !== codi){
        darrerCodiGir = codi;
        llancaGirCalendari();
      }
    }
  }

  // ---------- Gir de l'esfera interior (astrolabi): a les 12 del migdia i del
  // vespre (migdia = després de les 11:59; vespre/mitjanit = després de les
  // 23:59), en sentit contrari al del calendari. ----------
  const astrolabiFlipEl = document.getElementById('astrolabiFlip');
  let girEnCursAst = false;
  if (astrolabiFlipEl){
    astrolabiFlipEl.addEventListener('animationend', () => {
      girEnCursAst = false;
      astrolabiFlipEl.classList.remove('girant');
    });
  }

  function llancaGirAstrolabi(){
    if (!astrolabiFlipEl || girEnCursAst) return;
    girEnCursAst = true;
    astrolabiFlipEl.classList.remove('girant');
    void astrolabiFlipEl.offsetWidth;
    astrolabiFlipEl.classList.add('girant');
  }

  let primerGirAstFet = false;
  let darrerCodiGirAst = -1;
  function comprovaGirAstrolabi(ara){
    if (!primerGirAstFet && performance.now() - inicPaginaMs >= 7000){
      primerGirAstFet = true;
      llancaGirAstrolabi();
    }
    const s = ara.getSeconds();
    const m = ara.getMinutes();
    const h = ara.getHours();
    if (m === 59 && s >= 50 && s <= 52 && (h === 11 || h === 23)){
      const codi = h*100 + 59;
      if (darrerCodiGirAst !== codi){
        darrerCodiGirAst = codi;
        llancaGirAstrolabi();
      }
    }
  }

  // Campanades a la catalana: un quart, dos quarts, tres quarts i quatre quarts
  // (l'hora en punt), seguides —just a l'hora en punt— de tantes campanades
  // greus com marca el rellotge (format 12 hores).
  let darrerCodiCampanada = -1;
  function comprovaCampanades(ara){
    const s = ara.getSeconds();
    const m = ara.getMinutes();
    const h = ara.getHours();
    const FINESTRA = 4; // segons de marge per detectar el disparador encara que el rellotge vagi endarrerit
    let accio = null;
    let codi = null;
    if (m === 15 && s <= FINESTRA){
      codi = h*100 + 15;
      accio = () => reprodueixSequencia(1, reprodueixCampanaLleu);
    } else if (m === 30 && s <= FINESTRA){
      codi = h*100 + 30;
      accio = () => reprodueixSequencia(2, reprodueixCampanaLleu);
    } else if (m === 45 && s <= FINESTRA){
      codi = h*100 + 45;
      accio = () => reprodueixSequencia(3, reprodueixCampanaLleu);
    } else if (m === 0 && s <= FINESTRA){
      codi = h*100 + 0;
      accio = () => {
        reprodueixSequencia(4, reprodueixCampanaLleu);
        const h12 = h % 12;
        const compteHora = h12 === 0 ? 12 : h12;
        // l'última de les 4 campanades lleus sona als 6s (3 intervals de 2s); hi afegim
        // mig segon més que l'interval normal (2s + 0,5s = 2,5s) de marge abans de l'hora
        setTimeout(()=> reprodueixSequencia(compteHora, reprodueixCampanaGreu), 6000 + 2500);
      };
    }
    if (accio && codi !== darrerCodiCampanada){
      darrerCodiCampanada = codi;
      accio();
    }
  }

  setInterval(()=> {
    const ara = new Date();
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      comprovaGirCalendari(ara);
      comprovaGirAstrolabi(ara);
    }
    comprovaCampanades(ara);
  }, 1000);

  // ---------- Títol "Orloj" com a botó per desbloquejar l'àudio ----------
  // Els navegadors bloquegen qualsevol so fins que l'usuari interactua directament
  // amb la pàgina. En prémer el títol, només desbloquegem l'àudio (sense tocs
  // de prova): a partir d'aquí, les campanades reals dels quarts i les hores
  // ja sonaran amb normalitat.
  const titolEl = document.querySelector('h1');
  if (titolEl){
    titolEl.addEventListener('click', () => {
      const ctx = obtenirAudioCtx();
      if (ctx) carregaBufferEngranatge(ctx); // precarreguem el so d'engranatge d'entrada
    });
  }

  // ---------- Cometa Halley: creua l'interior de l'esfera lunar cada 76s ----------
  function llancaCometaLluna(){
    const cometaEl = document.getElementById('cometaLluna');
    const orientEl = document.getElementById('cometaOrient');
    if (!cometaEl || !orientEl) return;
    const angle1 = Math.random()*360;
    const angle2 = angle1 + 100 + Math.random()*160; // corda aleatòria, no sempre un diàmetre
    const r = 163; // dins del disc lunar (r=165), evitant l'anell zodiacal que es dibuixa per sobre
    const x0 = polarX(CX, r, angle1), y0 = polarY(CY, r, angle1);
    const x1 = polarX(CX, r, angle2), y1 = polarY(CY, r, angle2);
    const angleViatge = Math.atan2(y1-y0, x1-x0) * 180/Math.PI;
    const durada = 3200 + Math.random()*1400; // ms

    orientEl.setAttribute('transform', `rotate(${angleViatge})`);
    cometaEl.style.opacity = '0';

    const inici = performance.now();
    function pas(araMs){
      const t = Math.min(1, (araMs - inici) / durada);
      const x = x0 + (x1 - x0) * t;
      const y = y0 + (y1 - y0) * t;
      cometaEl.setAttribute('transform', `translate(${x}, ${y})`);
      let opacitat = 1;
      if (t < 0.08) opacitat = t / 0.08;
      else if (t > 0.9) opacitat = (1 - t) / 0.1;
      cometaEl.style.opacity = opacitat.toFixed(2);
      if (t < 1) requestAnimationFrame(pas);
    }
    requestAnimationFrame(pas);
  }

  function programaCometaLluna(){
    const espera = 76000 + (Math.random()*2000 - 1000); // ~76s (±1s perquè no sigui robòtic)
    setTimeout(()=>{ llancaCometaLluna(); programaCometaLluna(); }, espera);
  }
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    const primeraEspera = 4000 + Math.random()*1000; // primera aparició als 4-5s de carregar
    setTimeout(()=>{ llancaCometaLluna(); programaCometaLluna(); }, primeraEspera);
  }

  // ---------- Ambient: temperatura i altitud reals (Open-Meteo) ----------
  function actualitzaAmbient(){
    if (!('geolocation' in navigator)) return;
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const { latitude, longitude } = pos.coords;

      // Promise.allSettled: si un dels tres serveis falla o triga, els altres
      // dos segueixen actualitzant-se amb normalitat (no es perd la connectivitat).
      const [rTemp, rElev, rLloc] = await Promise.allSettled([
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature`),
        fetch(`https://api.open-meteo.com/v1/elevation?latitude=${latitude}&longitude=${longitude}`),
        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=ca`)
      ]);

      try {
        if (rTemp.status === 'fulfilled'){
          const dTemp = await rTemp.value.json();
          const temp = (dTemp && dTemp.current) ? dTemp.current.temperature_2m : null;
          const sensacio = (dTemp && dTemp.current) ? dTemp.current.apparent_temperature : null;
          const hum = (dTemp && dTemp.current) ? dTemp.current.relative_humidity_2m : null;
          if (temp !== null && temp !== undefined){
            document.getElementById('lecturaTemp').textContent = `${temp.toFixed(1).replace('.', ',')}°C`;
          }
          if (hum !== null && hum !== undefined){
            document.getElementById('lecturaHum').textContent = `${Math.round(hum)}%`;
          }
          if (sensacio !== null && sensacio !== undefined){
            document.getElementById('lecturaSensacio').textContent = `${sensacio.toFixed(1).replace('.', ',')}°C`;
          }
        }
      } catch(err){
        console.warn("Orloj: no s'ha pogut obtenir la temperatura/humitat", err);
      }

      try {
        if (rElev.status === 'fulfilled'){
          const dElev = await rElev.value.json();
          const elev = (dElev && dElev.elevation) ? dElev.elevation[0] : null;
          if (elev !== null && elev !== undefined){
            document.getElementById('lecturaAlt').textContent = `${Math.round(elev)} m`;
          }
        }
      } catch(err){
        console.warn("Orloj: no s'ha pogut obtenir l'altitud", err);
      }

      try {
        if (rLloc.status === 'fulfilled'){
          const dLloc = await rLloc.value.json();
          const poblacio = (dLloc && (dLloc.city || dLloc.locality || dLloc.principalSubdivision)) || null;
          if (poblacio){
            document.getElementById('lecturaLloc').textContent = poblacio;
          }
        }
      } catch(err){
        console.warn("Orloj: no s'ha pogut obtenir la població", err);
      }

    }, (err)=>{
      console.warn('Orloj: geolocalització no disponible', err);
    }, { enableHighAccuracy:false, timeout:8000, maximumAge:600000 });
  }

  actualitzaAmbient();
  setInterval(actualitzaAmbient, 15*60*1000);
})();
</script>
