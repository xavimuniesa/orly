<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orloj">
<meta name="theme-color" content="#100c08">
<title>Orloj — iPhone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --nit: #0a1330;
    --nit2: #142452;
    --pedra: #211a13;
    --pedra2: #16110c;
    --or: #d4af37;
    --or-clar: #f2d98a;
    --or-fosc: #8a6d1f;
    --or-viu: #f0c65c;
    --ivori: #f2e8d0;
    --vermell: #7a1f1f;
    --arg: #c9d2e0;
    --textura-patina: url("@PATINA_DATAURI@");
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, #3a2c18 0%, transparent 55%),
      radial-gradient(ellipse at 50% 120%, #000 0%, transparent 60%),
      linear-gradient(180deg, var(--pedra) 0%, var(--pedra2) 100%);
    color: var(--ivori);
    font-family: 'Cormorant Garamond', serif;
  }

  body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height: 100dvh;
    overflow-y: auto;
    padding:
      max(10px, env(safe-area-inset-top))
      max(10px, env(safe-area-inset-right))
      max(10px, env(safe-area-inset-bottom))
      max(10px, env(safe-area-inset-left));
  }

  .marc{
    width: min(100%, 92vh);
    max-width: 460px;
    border-radius: 22px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(212,175,55,0.06), transparent 60%),
      linear-gradient(180deg, #1b140d 0%, #100c08 100%);
    padding: 1.4vh 4vw 1.2vh;
    position: relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .contingut{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }
  .columna-esq, .columna-dre{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
  }

  header{
    text-align:center;
    flex: 0 0 auto;
  }
  h1{
    font-family: 'UnifrakturMaguntia', cursive;
    font-weight: 400;
    font-size: clamp(22px, 7vh, 38px);
    margin: 2px 0 0;
    color: var(--or-clar);
    text-shadow: 0 0 18px rgba(212,175,55,0.35), -1px -1px 0px rgba(255,250,230,0.45), 1px 1px 1.5px rgba(0,0,0,0.7);
    letter-spacing: 1px;
    line-height:1;
    cursor: pointer;
  }
  h1:active{
    filter: brightness(0.85);
  }
  .subtitol{
    font-family: 'Cinzel', serif;
    font-size: clamp(8px, 1.6vh, 11px);
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--or-viu);
    font-weight: 600;
    text-shadow: 0 0 6px rgba(240,198,92,0.35), -0.8px -0.8px 0 rgba(255,250,230,0.4), 0.8px 0.8px 1px rgba(0,0,0,0.65);
  }

  .disc-wrap{
    width: min(62vw, 40vh, 420px);
    flex: 0 0 auto;
    margin: 1vh auto 0;
    position: relative;
    aspect-ratio: 1 / 1;
  }
  .disc-wrap svg{ width:100%; height:100%; display:block; overflow:visible; }
  #astrolabiExt{ position:absolute; inset:0; }

  /* Gir de l'esfera interior (zodíac, lluna, busques): a les 12 del migdia i del
     vespre, en sentit contrari al de l'esfera del calendari, amb el mateix
     efecte de volum cilíndric daurat. La mida (87,3%) i el requadre retallat
     (viewBox) del SVG interior arriben fins radi 262, prou per cobrir la busca
     dels segons, que és la que arriba més lluny (radi 258) cap a l'anella blanca. */
  .astrolabi-flip-wrap{
    position: absolute;
    top: 50%; left: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%, -50%);
    perspective: 1600px;
  }
  .astrolabi-flip{
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }
  .astrolabi-flip.girant{
    animation: orlojGirAstrolabi 10.5s;
  }
  @keyframes orlojGirAstrolabi{
    0%      { transform: rotateY(0deg);    animation-timing-function: cubic-bezier(.45,.05,.55,.95); }
    42.857% { transform: rotateY(-180deg); animation-timing-function: linear; }
    57.143% { transform: rotateY(-180deg); animation-timing-function: cubic-bezier(.45,.05,.55,.95); }
    100%    { transform: rotateY(-360deg); }
  }
  .cos-cilindre-ast{
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    pointer-events: none;
    /* Invisible en repòs: com que la cara frontal té zones transparents
       (fora del disc del zodíac), aquesta pila daurada només s'ha de veure
       mentre dura el gir; en repòs quedaria tapant l'anella de les hores. */
    opacity: 0;
  }
  .astrolabi-flip.girant .cos-cilindre-ast{
    opacity: 1;
  }
  .cos-cilindre-ast .capa-volum-ast{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background-image: var(--textura-patina);
    background-size: 230% 230%;
    background-position: 32% 38%;
    background-repeat: no-repeat;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.7);
  }
  /* El planeta és sempre una esfera -no un cilindre pla apilat, que donava un
     reflex/costura artificial a mig gir. La perla viu al mateix espai 3D que
     el disc (com a fill directe de .astrolabi-flip) però amb dues peces:
     - #planetaOrbita: sense rotació pròpia, només la posició (segueix el
       disc en girar, exactament com fa cara-davant-ast) i backface-visibility
       hidden, perquè quan el disc ensenya el revers la perla quedi eclipsada
       -oculta- igual que la cara frontal, com si el propi rellotge la tapés.
     - #planetaEsfera: una animació que contrarota exactament el mateix
       angle que el disc, perquè la bola es vegi sempre rodona (mai
       aixafada en el·lipse) mentre estigui visible -continguda amb la
       posició de la perla en tot moment. */
  .planeta-orbita{
    position: absolute;
    width: 5.5%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%) translateZ(14px);
    transform-style: preserve-3d;
    backface-visibility: hidden;
    pointer-events: none;
  }
  .planeta-esfera{
    position: absolute;
    inset: 0;
  }
  .planeta-esfera svg{ width:100%; height:100%; display:block; overflow:visible; }
  .astrolabi-flip.girant .planeta-esfera{
    animation: orlojContrarotacioPlaneta 10.5s;
  }
  @keyframes orlojContrarotacioPlaneta{
    0%      { transform: rotateY(0deg);   animation-timing-function: cubic-bezier(.45,.05,.55,.95); }
    42.857% { transform: rotateY(180deg); animation-timing-function: linear; }
    57.143% { transform: rotateY(180deg); animation-timing-function: cubic-bezier(.45,.05,.55,.95); }
    100%    { transform: rotateY(360deg); }
  }
  .cara-davant-ast, .cara-darrere-ast{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }
  .cara-davant-ast{
    transform: translateZ(14px);
    background: transparent;
  }
  .cara-davant-ast svg{ width:100%; height:100%; display:block; overflow:visible; }
  .cara-darrere-ast{
    transform: rotateY(180deg) translateZ(14px);
    background-image: var(--textura-patina);
    background-size: 175% 175%;
    background-position: 40% 30%;
    background-repeat: no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lema-gravat-ast{
    font-family:'UnifrakturMaguntia', cursive;
    font-weight:400;
    font-size: clamp(24px, 5vw, 44px);
    letter-spacing: 0.5px;
    text-align:center;
    color: #9c7a1f;
    text-shadow:
      -1px -1px 1px rgba(60,40,5,0.65),
      1px 1.5px 1.5px rgba(255,244,200,0.7);
    padding: 0 6%;
  }

  .calendari-wrap{
    width: min(33vw, 21vh, 190px);
    margin: 1vh auto 0;
    position: relative;
    z-index: 2;
    flex: 0 0 auto;
    perspective: 1400px;
  }
  .calendari-wrap svg{ width:100%; height:auto; display:block; }

  .calendari-flip{
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    transform-style: preserve-3d;
  }
  .calendari-flip.girant{
    animation: orlojGirCalendari 10.5s;
  }
  @keyframes orlojGirCalendari{
    0%      { transform: rotateY(0deg);   animation-timing-function: cubic-bezier(.45,.05,.55,.95); }
    42.857% { transform: rotateY(180deg); animation-timing-function: linear; }
    57.143% { transform: rotateY(180deg); animation-timing-function: cubic-bezier(.45,.05,.55,.95); }
    100%    { transform: rotateY(360deg); }
  }

  .cos-cilindre{
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    pointer-events: none;
  }
  .cos-cilindre .capa-volum{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background-image: var(--textura-patina);
    background-size: 230% 230%;
    background-position: 68% 60%;
    background-repeat: no-repeat;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.7);
  }

  .cara-davant, .cara-darrere{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }
  .cara-davant{
    transform: translateZ(14px);
  }
  .cara-davant svg{ width:100%; height:100%; }
  .cara-darrere{
    transform: rotateY(180deg) translateZ(14px);
    background-image: var(--textura-patina);
    background-size: 175% 175%;
    background-position: 62% 58%;
    background-repeat: no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .lema-gravat{
    font-family:'UnifrakturMaguntia', cursive;
    font-weight:400;
    font-size: clamp(13px, 8.5vw, 23px);
    letter-spacing: 0.4px;
    text-align:center;
    color: #9c7a1f;
    text-shadow:
      -0.8px -0.8px 1px rgba(60,40,5,0.65),
      0.8px 1.2px 1.2px rgba(255,244,200,0.7);
  }

  .lectura{
    text-align:center;
    flex: 0 0 auto;
    font-family:'Cinzel', serif;
  }
  .hora-digital{
    font-size: clamp(18px, 4.6vh, 28px);
    letter-spacing: 0;
    color: var(--or-clar);
    text-shadow: 0 0 12px rgba(212,175,55,0.3), -1px -1px 0 rgba(255,250,230,0.4), 1px 1px 1.5px rgba(0,0,0,0.7);
  }
  .hora-digital .xifra{
    display: inline-block;
    width: 0.62em;
    text-align: center;
  }
  .hora-digital .separador-hora{
    display: inline-block;
    width: 0.32em;
    text-align: center;
  }
  .data-digital{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(11px, 2.4vh, 15px);
    color: var(--arg);
    margin-top: 1px;
    text-shadow: -0.8px -0.8px 0 rgba(255,250,230,0.3), 0.8px 0.8px 1px rgba(0,0,0,0.5);
  }
  .luna-linia{
    margin-top: 3px;
    font-size: clamp(9px, 1.8vh, 12px);
    letter-spacing: 1.2px;
    color: var(--or-viu);
    font-weight: 600;
    text-transform: uppercase;
    text-shadow: -0.8px -0.8px 0 rgba(255,250,230,0.35), 0.8px 0.8px 1px rgba(0,0,0,0.6);
  }

  .ambient-linia{
    margin-top: 5px;
    font-size: clamp(10px, 2.4vw, 12px);
    letter-spacing: 1.2px;
    color: var(--or-viu);
    text-transform: uppercase;
    opacity: 0.9;
    text-shadow: -0.7px -0.7px 0 rgba(255,250,230,0.3), 0.7px 0.7px 1px rgba(0,0,0,0.55);
  }
  .ambient-linia .separador-punt{
    color: var(--or-fosc);
    margin: 0 5px;
  }

  .separador{
    width: 55%;
    max-width: 200px;
    height: 1px;
    margin: 6px auto;
    background: linear-gradient(90deg, transparent, var(--or-fosc), transparent);
  }

  .lema{
    display:none;
  }

  text{ font-family:'Cinzel', serif; user-select:none; }
  .num-antic{ font-family:'UnifrakturMaguntia', cursive; }

  @media (prefers-reduced-motion: reduce){
    * { transition: none !important; }
  }

  /* Mòbil en horitzontal: disposició en dues columnes, com la versió de tauleta */
  @media (orientation: landscape) and (max-height: 600px){
    body{ align-items:center; }
    .marc{
      width: min(96vw, 780px);
      max-width: none;
      padding: 1.6vh 3vw;
    }
    .contingut{
      flex-direction: row;
      align-items: center;
      gap: 3vw;
    }
    .columna-esq{ flex: 1 1 56%; width:auto; }
    .columna-dre{ flex: 1 1 40%; width:auto; }

    header{ margin-bottom: 0; }
    h1{ font-size: clamp(16px, 5.5vh, 26px); margin: 0; }
    .subtitol{ font-size: clamp(7px, 1.4vh, 10px); }

    .disc-wrap{
      width: min(44vw, 68vh, 380px);
      margin: 0.4vh auto 0;
    }
    .calendari-wrap{
      width: min(24vw, 38vh, 175px);
      margin: 0.5vh auto 0;
    }
    .separador{ margin: 3px auto; }
    .hora-digital{ font-size: clamp(14px, 5vh, 26px); }
    .data-digital{ font-size: clamp(9px, 2.2vh, 14px); }
    .luna-linia{ font-size: clamp(7px, 1.7vh, 11px); }
    .ambient-linia{ font-size: clamp(7px, 1.7vh, 11px); }
  }
/*@ORLOJ_CSS_COMU@*/
</style>
<!--@ORLOJ_HEAD@-->
</head>
<body>

  <div class="marc">
    <div class="contingut">
      <div class="columna-esq">
        <header>
          <div class="subtitol">Praga · MCDX</div>
          <h1>Orloj</h1>
        </header>

        <div class="disc-wrap">
          <div class="astrolabi-flip-wrap">
            <div class="astrolabi-flip" id="astrolabiFlip">
              <div class="cos-cilindre-ast" id="cosCilindreAst"></div>
              <div class="cara-davant-ast">
                <svg id="astrolabi" viewBox="0 0 600 600"></svg>
              </div>
              <div class="cara-darrere-ast"><span class="lema-gravat-ast" id="lemaAst">Astra manent,<br>sed…</span></div>
              <div class="planeta-orbita" id="planetaOrbita">
                <div class="planeta-esfera" id="planetaEsfera">
                  <svg viewBox="-16.5 -16.5 33 33" overflow="visible"></svg>
                </div>
              </div>
            </div>
          </div>
          <svg id="astrolabiExt" viewBox="0 0 600 600" style="pointer-events:none;"></svg>
        </div>
      </div>

      <div class="columna-dre">
        <div class="calendari-wrap">
          <div class="calendari-flip" id="calendariFlip">
            <div class="cos-cilindre" id="cosCilindre"></div>
            <div class="cara-davant">
              <svg id="calendari" viewBox="0 0 300 300"></svg>
            </div>
            <div class="cara-darrere"><span class="lema-gravat" id="lemaCal">tempus<br>fugit…</span></div>
          </div>
        </div>

        <div class="separador"></div>

        <div class="lectura">
          <div class="hora-digital" id="lecturaHora">--:--:--</div>
          <div class="data-digital" id="lecturaData">—</div>
          <div class="luna-linia" id="lecturaLluna">—</div>
          <div class="ambient-linia"><span id="lecturaTemp">--°C</span><span class="separador-punt">·</span><span id="lecturaHum">--%</span><span class="separador-punt">·</span><span id="lecturaSensacio">--°C</span><span class="separador-punt">·</span><span id="lecturaAlt">-- m</span></div>
      <div class="ambient-linia" id="lecturaLloc">—</div>
        </div>
      </div>
    </div>
  </div>

<!--@ORLOJ_CONTROLS@-->
<script>
/*@ORLOJ_CONFIG@*/
/*@ORLOJ_JS@*/
</script>
</body>
</html>
